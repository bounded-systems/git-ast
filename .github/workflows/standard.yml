name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@d126d721fa50275e12af0bdeaf1a2ff3016eedfd
    with:
      security: true
      test: true
      runtime: none
      test-command: "cargo fmt --all -- --check && cargo build --verbose && cargo test --verbose && cargo clippy --all-targets -- -D warnings"
