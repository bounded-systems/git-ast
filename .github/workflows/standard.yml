name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@99e88a0335519cb78be8a1b6623105613fa6aca1
    with:
      security: true
      test: true
      runtime: none
      test-command: "cargo fmt --all -- --check && cargo build --verbose && cargo test --verbose && cargo clippy --all-targets -- -D warnings"
